{% extends "base.html" %}
{% block content %}
<h1>Ajouter un crédentiel</h1>
<form method="post">
    <input type="text" name="site" placeholder="Site ou application" required>
    <input type="text" name="nom" placeholder="Nom d'utilisateur" required>
    <input type="password" name="mdp" placeholder="Mot de passe" required>
    <button type="submit">Enregistrer</button>
</form>
<p><a href="{{ url_for('dashboard') }}">Retour au menu</a></p>
{% endblock %}
