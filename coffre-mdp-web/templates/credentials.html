{% extends "base.html" %}
{% block content %}
<h1>Mes crédentiels</h1>
{% if creds %}
    {% for c in creds %}
    <div class="cred">
        <strong>{{ c.Site }}</strong><br>
        Utilisateur : {{ c.Nom }}<br>
        Mot de passe : {{ c["Mot de passe"] }}
        <form method="post" action="{{ url_for('delete_credential', index=loop.index0) }}" style="margin-top:6px;">
            <button type="submit" class="btn-danger">Supprimer</button>
        </form>
    </div>
    {% endfor %}
{% else %}
    <p>Aucun crédentiel enregistré pour le moment.</p>
{% endif %}
<p><a href="{{ url_for('dashboard') }}">Retour au menu</a></p>
{% endblock %}
